<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>🌐 Real-time Voice Translator</h1>

    <!-- ตัวเลือกภาษา -->
    <div class="language-box">
      <div class="lang-group">
        <label>Speaker A:</label>
        <select id="langA">
          <option value="th-TH" data-short="th">🇹🇭 ไทย</option>
          <option value="my-MM" data-short="my">🇲🇲 မြန်မာစာ (พม่า)</option>
        </select>
      </div>

      <button id="swap" onclick="swapLanguages()">🔄</button>

      <div class="lang-group">
        <label>Speaker B:</label>
        <select id="langB">
          <option value="my-MM" data-short="my">🇲🇲 မြန်မာစာ (พม่า)</option>
          <option value="en-US" data-short="en">🇺🇸 English</option>
          <option value="ja-JP" data-short="ja">🇯🇵 日本語</option>
          <option value="zh-CN" data-short="zh">🇨🇳 中文</option>
          <option value="ko-KR" data-short="ko">🇰🇷 한국어</option>
        </select>
      </div>
    </div>

    <!-- ส่วนการรับเสียง Speaker A & Speaker B -->
    <div class="speakers-container">
      
      <!-- Speaker A Card -->
      <div class="card speaker-a">
        <h2>👤 Speaker A</h2>
        <div class="text-box">
          <p id="originalA">กดปุ่ม 🎤 แล้วเริ่มพูด...</p>
        </div>
        <div class="text-box translate">
          <p id="translatedA">คำแปลจะแสดงที่นี่</p>
          <button class="speaker-btn" onclick="playSpeakerSound('A')" title="ฟังเสียงอ่าน">🔊</button>
        </div>
        <button id="micA" class="mic" onclick="startListening('A')">🎤 พูด (A)</button>
      </div>

      <!-- Speaker B Card -->
      <div class="card speaker-b">
        <h2>🗣️ Speaker B</h2>
        <div class="text-box">
          <p id="originalB">Press 🎤 and speak...</p>
        </div>
        <div class="text-box translate">
          <p id="translatedB">Translation will appear here</p>
          <button class="speaker-btn" onclick="playSpeakerSound('B')" title="Listen">🔊</button>
        </div>
        <button id="micB" class="mic" onclick="startListening('B')">🎤 พูด (B)</button>
      </div>

    </div>

    <!-- ประวัติการสนทนา -->
    <div class="history">
      <h3>💬 Conversation History</h3>
      <div id="chat" class="chat-box"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
