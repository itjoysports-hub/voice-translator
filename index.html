<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Voice Translator (Gemini AI)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>🌐 Real-time Voice Translator</h1>

    <!-- ตัวเลือกภาษา --->
    <div class="language-box">
      <div class="lang-group">
        <label>Speaker A:</label>
        <select id="langA">
          <option value="th-TH" data-langname="Thai">🇹🇭 ไทย</option>
          <option value="my-MM" data-langname="Burmese">🇲🇲 မြန်မာစာ (พม่า)</option>
        </select>
      </div>

      <button id="swap" onclick="swapLanguages()" title="สลับภาษา">🔄</button>

      <div class="lang-group">
        <label>Speaker B:</label>
        <select id="langB">
          <option value="my-MM" data-langname="Burmese">🇲🇲 မြန်မာစာ (พม่า)</option>
          <option value="en-US" data-langname="English">🇺🇸 English</option>
          <option value="ja-JP" data-langname="Japanese">🇯🇵 日本語</option>
          <option value="zh-CN" data-langname="Chinese">🇨🇳 中文</option>
          <option value="ko-KR" data-langname="Korean">🇰🇷 한국어</option>
        </select>
      </div>
    </div>

    <!-- ส่วนปรับแต่งเสียงอ่าน (ความเร็ว & โทนเสียง) -->
    <div class="controls-box">
      <div class="control-item">
        <label for="speechRate">🐌 ความเร็วเสียง:</label>
        <select id="speechRate">
          <option value="1.0">ปกติ (1.0x)</option>
          <option value="0.8" selected>ช้ากำลังดี (0.8x) 🎧</option>
          <option value="0.6">ช้ามาก (0.6x) 🐢</option>
        </select>
      </div>

      <div class="control-item">
        <label for="voicePitch">🗣️ โทนเสียงอ่าน:</label>
        <select id="voicePitch">
          <option value="1.0" selected>เสียงปกติ (Standard)</option>
          <option value="1.2">เสียงผู้หญิง (High Pitch)</option>
          <option value="0.8">เสียงผู้ชาย (Low Pitch/Deep)</option>
        </select>
      </div>
    </div>

    <!-- ส่วนการรับเสียง Speaker A & Speaker B -->
    <div class="speakers-container">
      
      <!-- Speaker A Card -->
      <div class="card speaker-a">
        <h2>👤 Speaker A</h2>
        <div class="text-box">
          <p id="originalA">กดปุ่ม 🎤 แล้วเริ่มพูด...</p>
        </div>
        <div class="text-box translate">
          <p id="translatedA">คำแปลจะแสดงที่นี่</p>
          <button class="speaker-btn" onclick="playSpeakerSound('A')" title="ฟังเสียงอ่าน">🔊</button>
        </div>
        <button id="micA" class="mic" onclick="startListening('A')">🎤 พูด (A)</button>
      </div>

      <!-- Speaker B Card -->
      <div class="card speaker-b">
        <h2>🗣️ Speaker B</h2>
        <div class="text-box">
          <p id="originalB">Press 🎤 and speak...</p>
        </div>
        <div class="text-box translate">
          <p id="translatedB">Translation will appear here</p>
          <button class="speaker-btn" onclick="playSpeakerSound('B')" title="Listen">🔊</button>
        </div>
        <button id="micB" class="mic" onclick="startListening('B')">🎤 พูด (B)</button>
      </div>

    </div>

    <!-- ประวัติการสนทนา -->
    <div class="history">
      <h3>💬 Conversation History</h3>
      <div id="chat" class="chat-box"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
