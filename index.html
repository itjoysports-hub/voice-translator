<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Translator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>🌐 Voice Translator</h1>

<div class="language-box">

<select id="fromLang">
<option value="th-TH">🇹🇭 ไทย</option>
<option value="en-US">🇺🇸 English</option>
<option value="ja-JP">🇯🇵 日本語</option>
<option value="zh-CN">🇨🇳 中文</option>
<option value="my-MM">🇲🇲 မြန်မာစာ (พม่า)</option>
</select>


<button id="swap" onclick="swapLanguages()">🔄</button>


<select id="toLang">
<option value="my-MM">🇲🇲 မြန်မာစာ (พม่า)</option>
<option value="en-US">🇺🇸 English</option>
<option value="th-TH">🇹🇭 ไทย</option>
<option value="ja-JP">🇯🇵 日本語</option>
<option value="zh-CN">🇨🇳 中文</option>
</select>

</div>

<div class="cards-container">

  <!-- Speaker A -->
  <div class="card">

  <h2>👤 Speaker A</h2>

  <div class="text-box">
  <p id="originalA">
  กดปุ่ม 🎤 แล้วพูด
  </p>
  </div>


  <div class="text-box translate">
  <p id="translatedA">
  คำแปล
  </p>
  </div>


  <button class="mic" id="micA" onclick="startVoice('A')">
  🎤
  </button>

  </div>


  <!-- Speaker B -->
  <div class="card">

  <h2>🗣️ Speaker B</h2>

  <div class="text-box">
  <p id="originalB">
  กดปุ่ม 🎤 แล้วพูด
  </p>
  </div>


  <div class="text-box translate">
  <p id="translatedB">
  คำแปล
  </p>
  </div>


  <button class="mic" id="micB" onclick="startVoice('B')">
  🎤
  </button>

  </div>

</div>


<div class="history">

<h3>💬 Conversation</h3>

<div id="chat"></div>

</div>


</div>


<script src="app.js"></script>

</body>
</html>
